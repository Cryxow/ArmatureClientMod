name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21.8', '1.21.9', '1.21.10', '1.21.11', '26.1', '26.1.1', '26.1.2', '26.2']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Build the tagged version
        env:
          TAG: ${{ github.ref_name }}
          MINECRAFT: ${{ matrix.minecraft }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          ./gradlew --no-daemon test build compileGametestJava "-PmodVersion=$version" "-PminecraftVersion=$MINECRAFT"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.minecraft }}
          if-no-files-found: error
          path: build/${{ matrix.minecraft }}/libs/*.jar
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          args=(--verify-tag --title "Armature Client $version" --generate-notes)
          if [[ "$version" == *-* ]]; then args+=(--prerelease); fi
          (cd artifacts && sha256sum *.jar > SHA256SUMS.txt)
          gh release create "$TAG" artifacts/*.jar artifacts/SHA256SUMS.txt "${args[@]}"
