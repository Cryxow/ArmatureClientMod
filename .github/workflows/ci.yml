name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: client-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Build and run headless tests
        run: ./gradlew --no-daemon test build compileGametestJava
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: armature-client-${{ github.sha }}
          if-no-files-found: error
          path: build/libs/*.jar
