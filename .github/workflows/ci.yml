name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: client-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21.8', '1.21.9', '1.21.10', '1.21.11', '26.1', '26.1.1', '26.1.2', '26.2']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Build and run headless tests
        run: ./gradlew --no-daemon test build compileGametestJava -PminecraftVersion=${{ matrix.minecraft }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: armature-client-${{ matrix.minecraft }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/${{ matrix.minecraft }}/libs/*.jar
            !build/${{ matrix.minecraft }}/libs/*-sources.jar
